name: Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg

      - name: Conversion tests
        run: scripts/test-conversions.sh

      - name: Package app
        run: |
          scripts/build-app.sh
          ditto -c -k --keepParent build/Clementine.app build/Clementine.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Clementine-app
          path: build/Clementine.zip
